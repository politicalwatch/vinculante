# Infraestructura ligera para servidores con poca RAM (sin build del engine)
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: vinculante
      POSTGRES_PASSWORD: vinculante
      POSTGRES_DB: vinculante
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=128MB
      - -c
      - max_connections=30
    volumes:
      - vinculante-postgres:/var/lib/postgresql/data

  redis:
    image: redis:8.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --maxmemory 48mb --maxmemory-policy allkeys-lru

volumes:
  vinculante-postgres:
