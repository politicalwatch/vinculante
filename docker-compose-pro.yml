services:
  postgres:
    image: pgvector/pgvector:pg17
    env_file:
      - .env
    volumes:
      - vinculante-postgres:/var/lib/postgresql/data

  redis:
    image: redis:8.2

  engine:
    build: ./engine
    container_name: vinculante-engine
    restart: unless-stopped
    env_file:
      - .env
    command:
      [
        "uvicorn",
        "vinculante.main:create_app",
        "--factory",
        "--proxy-headers",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]

  frontend:
    image: politicalwatch/vinculante:latest
    container_name: vinculante-frontend
    restart: unless-stopped
    env_file:
      - .env.frontend
    ports:
      - 3001:3000

volumes:
  vinculante-postgres: